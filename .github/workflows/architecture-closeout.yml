name: Backend Architecture Closeout Executor

on:
  push:
    branches:
      - fix/stage-a-production-definitions
    paths:
      - tools/architecture-closeout.mjs
      - tools/architecture-closeout-residue.mjs
      - tools/architecture-closeout-finalize.mjs
      - tools/architecture-closeout-lastmile.mjs
      - tools/architecture-closeout-quality.mjs
      - tools/architecture-closeout-constitution-gate.mjs
      - tools/generate-module-readmes.mjs
      - tests/integration/database/**
      - .github/workflows/architecture-closeout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-architecture-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://carbroz_ci:carbroz_ci@127.0.0.1:5432/carbroz_ci
      JWT_SECRET: carbroz-ci-validation-only-secret-not-for-runtime
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carbroz_ci
          POSTGRES_PASSWORD: carbroz_ci
          POSTGRES_DB: carbroz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carbroz_ci -d carbroz_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout architecture branch
        uses: actions/checkout@v4
        with:
          ref: fix/stage-a-production-definitions
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate repository pnpm version
        run: corepack prepare pnpm@11.9.0 --activate

      - name: Install current workspace
        run: pnpm install --no-frozen-lockfile

      - name: Execute constitution closeout migration
        run: node tools/architecture-closeout.mjs

      - name: Finalize product-surface isolation
        run: node tools/architecture-closeout-finalize.mjs

      - name: Finalize last-mile ownership convergence
        run: node tools/architecture-closeout-lastmile.mjs

      - name: Generate final module architecture documentation
        run: node tools/generate-module-readmes.mjs

      - name: Enforce final constitution topology and ownership
        run: node tools/architecture-closeout-constitution-gate.mjs

      - name: Reinstall final workspace and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Prove frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply PostgreSQL migrations
        run: pnpm exec prisma migrate deploy

      - name: Build final monorepo
        run: pnpm -r build

      - name: Lint final monorepo
        run: pnpm lint

      - name: Test final monorepo
        shell: bash
        run: |
          set -o pipefail
          pnpm test -- --run 2>&1 | tee closeout-test-output.txt

      - name: Upload closeout test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: closeout-test-diagnostics
          path: closeout-test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce final production coverage
        run: pnpm test:freeze

      - name: Re-run constitution gate after executable validation
        run: node tools/architecture-closeout-constitution-gate.mjs

      - name: Remove one-time migration tooling
        run: |
          rm -f tools/architecture-closeout.mjs
          rm -f tools/architecture-closeout-residue.mjs
          rm -f tools/architecture-closeout-finalize.mjs
          rm -f tools/architecture-closeout-lastmile.mjs
          rm -f tools/architecture-closeout-constitution-gate.mjs
          rm -f tools/generate-module-readmes.mjs
          rm -f .github/workflows/architecture-closeout.yml
          rmdir tools 2>/dev/null || true

      - name: Commit constitution-closed source
        run: |
          git config user.name "CarBroz Architecture Bot"
          git config user.email "architecture@carbroz.local"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(architecture): close backend constitution"
          git push origin HEAD:fix/stage-a-production-definitions
