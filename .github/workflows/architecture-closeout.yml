name: Backend Architecture Closeout Verifier

on:
  push:
    branches:
      - main
      - development
    paths:
      - '.github/workflows/architecture-closeout.yml'
      - '.github/workflows/ci.yml'
      - 'tools/architecture-closeout.mjs'
      - 'tools/architecture-closeout-constitution-gate.mjs'
      - 'tools/cw3-boundary-gate.mjs'
      - 'tools/cw4-contract-gate.mjs'
      - 'tools/cw5-resource-ownership-gate.mjs'
      - 'tools/cw5-error-semantics-gate.mjs'
      - 'tools/cw5-runtime-config-gate.mjs'
      - 'tools/cw5-observability-pii-gate.mjs'
      - 'tools/production-freeze/preflight.mjs'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'apps/api/**'
      - 'domains/**'
      - 'sdui/**'
      - 'platform/**'
      - 'foundation/**'
      - 'tests/architecture/**'
      - 'tests/contracts/**'
      - 'tests/integration/**'
      - 'tests/e2e/**'
      - 'tests/unit/api-error-boundary.behavior.test.ts'
      - 'docs/CW2-PHYSICAL-STRUCTURE-CLOSEOUT.md'
      - 'docs/CW3-BOUNDED-CONTEXT-DEPENDENCY-CLOSEOUT.md'
      - 'docs/CW4-DOMAIN-APPLICATION-CONTRACT-CLOSEOUT.md'
      - 'docs/PRODUCTION_FREEZE_EXECUTION.md'
      - 'docs/PRODUCTION_FREEZE_PLAYBOOK.md'
      - 'docs/CONSTITUTION-COMPLIANCE-MATRIX.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-architecture-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-closed-architecture:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://carbroz_ci:carbroz_ci@127.0.0.1:5432/carbroz_ci
      JWT_SECRET: carbroz-ci-validation-only-secret-not-for-runtime
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carbroz_ci
          POSTGRES_PASSWORD: carbroz_ci
          POSTGRES_DB: carbroz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carbroz_ci -d carbroz_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate repository pnpm version
        run: corepack prepare pnpm@11.9.0 --activate

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Verify canonical CW2 topology
        run: node tools/architecture-closeout.mjs

      - name: Verify Backend Constitution regression boundary
        run: node tools/architecture-closeout-constitution-gate.mjs --regression

      - name: Verify full Backend Constitution
        run: node tools/architecture-closeout-constitution-gate.mjs

      - name: Verify CW3 bounded-context and dependency convergence
        run: node tools/cw3-boundary-gate.mjs

      - name: Verify CW4 domain/application contract convergence
        run: node tools/cw4-contract-gate.mjs

      - name: Verify CW5 resource ownership and public IDs
        run: node tools/cw5-resource-ownership-gate.mjs

      - name: Verify CW5 error semantics and leakage containment
        run: node tools/cw5-error-semantics-gate.mjs

      - name: Verify CW5 runtime configuration and secret separation
        run: node tools/cw5-runtime-config-gate.mjs

      - name: Verify CW5 observability and PII containment
        run: node tools/cw5-observability-pii-gate.mjs

      - name: Validate Prisma
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply PostgreSQL migrations
        run: pnpm exec prisma migrate deploy

      - name: Build canonical monorepo
        run: pnpm build

      - name: Lint canonical monorepo
        run: pnpm exec eslint --quiet .

      - name: Test canonical monorepo at 100/100/100/100 coverage
        shell: bash
        run: |
          set -o pipefail
          pnpm test:freeze 2>&1 | tee closeout-test-output.txt

      - name: Upload closeout test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cw5-closeout-test-diagnostics
          path: |
            closeout-test-output.txt
            coverage/coverage-final.json
            apps/api/src
            domains
            platform
            foundation
            sdui/engine/src
            sdui/registry/src
            sdui/ui-sdk/src
            tests
            vitest.config.ts
          if-no-files-found: ignore
          retention-days: 7

      - name: Re-verify full Backend Constitution
        run: node tools/architecture-closeout-constitution-gate.mjs

      - name: Re-verify CW3 bounded-context and dependency convergence
        run: node tools/cw3-boundary-gate.mjs

      - name: Re-verify CW4 domain/application contract convergence
        run: node tools/cw4-contract-gate.mjs

      - name: Re-verify CW5 resource ownership and public IDs
        run: node tools/cw5-resource-ownership-gate.mjs

      - name: Re-verify CW5 error semantics and leakage containment
        run: node tools/cw5-error-semantics-gate.mjs

      - name: Re-verify CW5 runtime configuration and secret separation
        run: node tools/cw5-runtime-config-gate.mjs

      - name: Re-verify CW5 observability and PII containment
        run: node tools/cw5-observability-pii-gate.mjs

      - name: Prove closeout verification is read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
