name: Backend Architecture Closeout Verifier

on:
  push:
    branches: [development]

permissions:
  contents: write

concurrency:
  group: phase12-retirement-one-shot
  cancel-in-progress: true

jobs:
  retire-ui-sdk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate repository pnpm version
        run: corepack prepare pnpm@11.9.0 --activate

      - name: Build final Phase 12 retirement tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -r sdui/ui-sdk
          pnpm install --lockfile-only --no-frozen-lockfile
          git add pnpm-lock.yaml
          test ! -e sdui/ui-sdk
          if git grep -nE "from ['\"]@carbroz/ui-sdk|import[[:space:]]*\(['\"]@carbroz/ui-sdk|['\"]@carbroz/ui-sdk['\"][[:space:]]*:" -- ':!docs/**'; then
            echo 'Live ui-sdk import or package dependency remains' >&2
            exit 1
          fi

      - name: Commit retirement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CarBroz Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "refactor(sdui): retire legacy ui-sdk workspace"
          git push origin HEAD:development
