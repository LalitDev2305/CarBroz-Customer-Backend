name: Backend V3 Canonical Migration

on:
  push:
    branches:
      - feature/backend-v3-canonical-migration

permissions:
  contents: write

jobs:
  migrate-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.9.0 --activate
      - name: Normalize migration runner
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const file = 'tools/backend-v3-migrate.mjs';
          let s = fs.readFileSync(file, 'utf8');
          s = s.replace("['domains/partner/', 'domains/catalog-pricing/', 'domains/financials/', 'domains/operations/', 'domains/communications/', 'domains/engagement/', 'domains/configuration/', 'domains/enterprise/', 'apps/api', 'GLOBAL', 'PARTNER', 'CUSTOMER']", "['partner/', 'catalog-pricing/', 'financials/', 'operations/', 'communications/', 'engagement/', 'configuration/', 'enterprise/', 'apps/', 'GLOBAL', 'PARTNER', 'CUSTOMER']");
          s = s.replace("if (!owner || !newAbs.endsWith('.ts')) continue;", "if (!owner || !newAbs.endsWith('.ts') || !fs.existsSync(newAbs)) continue;");
          s = s.replace("/import\\s+(type\\s+)?\\{([\\s\\S]*?)\\}\\s+from\\s+['\"]@carbroz\\/common['\"];?/g", "/import\\s+(type\\s+)?\\{([^}]*)\\}\\s+from\\s+['\"]@carbroz\\/common['\"];?/g");
          fs.writeFileSync(file, s);
          NODE
      - name: Generate canonical architecture
        run: node tools/backend-v3-migrate.mjs
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Prisma validate
        run: pnpm prisma validate
      - name: Prisma generate
        run: pnpm prisma generate
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm exec eslint --quiet .
      - name: Test
        run: pnpm test
      - name: Verify final topology
        run: node tools/backend-v3-migrate.mjs
      - name: Commit validated migration
        shell: bash
        run: |
          git config user.name "CarBroz Architecture Bot"
          git config user.email "architecture@carbroz.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes remain."
          else
            git commit -m "refactor(architecture): migrate backend to canonical v3 topology"
            git push origin HEAD:feature/backend-v3-canonical-migration
          fi
