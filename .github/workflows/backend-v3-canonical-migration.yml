name: Backend V3 Canonical Implementation

on:
  push:
    branches:
      - feature/backend-v3-canonical-migration

permissions:
  contents: write

jobs:
  implement-structure-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve canonical assets before legacy pruning
        run: node tools/preserve-backend-v3-canonical-assets.mjs
      - name: Generate canonical architecture
        run: node tools/run-backend-v3-migration.mjs
      - name: Finalize constitution execution policy
        run: node tools/finalize-backend-v3-constitution-execution-policy.mjs
      - name: Finalize canonical platform workspaces
        run: node tools/finalize-backend-v3-platform.mjs
      - name: Finalize single bounded-context ownership
        run: node tools/finalize-backend-v3-single-ownership.mjs
      - name: Finalize relocated symbol ownership
        run: node tools/finalize-backend-v3-symbol-ownership.mjs
      - name: Finalize canonical capability internals
        run: node tools/finalize-backend-v3-canonical-internals.mjs
      - name: Finalize SDUI contracts
        run: node tools/finalize-backend-v3-sdui.mjs
      - name: Finalize domain dependency boundaries
        run: node tools/finalize-backend-v3-domain-dependencies.mjs
      - name: Finalize Partner bounded context
        run: node tools/finalize-backend-v3-partner.mjs
      - name: Finalize Configuration bounded context
        run: node tools/finalize-backend-v3-configuration.mjs
      - name: Finalize integration contracts
        run: node tools/finalize-backend-v3-integrations.mjs
      - name: Finalize Identity bounded context
        run: node tools/finalize-backend-v3-identity.mjs
      - name: Finalize Financials bounded context
        run: node tools/finalize-backend-v3-financials.mjs
      - name: Finalize package import boundaries
        run: node tools/finalize-backend-v3-import-boundaries.mjs
      - name: Finalize workspace dependency graph
        run: node tools/finalize-backend-v3-workspace-graph.mjs
      - name: Finalize strict TypeScript semantics
        run: node tools/finalize-backend-v3-strictness.mjs
      - name: Finalize customer hydration
        run: node tools/finalize-backend-v3-customer-hydration.mjs
      - name: Verify canonical repository structure only
        run: node tools/verify-backend-v3-canonical-structure.mjs
      - name: Commit implementation snapshot
        shell: bash
        run: |
          git config user.name "CarBroz Architecture Bot"
          git config user.email "architecture@carbroz.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes remain."
          else
            git commit -m "refactor(architecture): complete canonical backend v3 implementation snapshot"
            git push origin HEAD:feature/backend-v3-canonical-migration
          fi
