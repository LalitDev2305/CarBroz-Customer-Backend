name: Backend V3 Canonical Migration

on:
  push:
    branches:
      - feature/backend-v3-canonical-migration

permissions:
  contents: write

jobs:
  migrate-validate-commit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carbroz_validation
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.9.0 --activate
      - name: Generate canonical architecture
        run: node tools/run-backend-v3-migration.mjs
      - name: Finalize canonical platform workspaces
        run: node tools/finalize-backend-v3-platform.mjs
      - name: Finalize package import boundaries
        run: node tools/finalize-backend-v3-import-boundaries.mjs
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Prisma validate
        run: pnpm prisma validate
      - name: Prisma generate
        run: pnpm prisma generate
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm exec eslint --quiet .
      - name: Test
        run: pnpm test
      - name: Verify final topology
        run: |
          node tools/run-backend-v3-migration.mjs
          node tools/finalize-backend-v3-platform.mjs
          node tools/finalize-backend-v3-import-boundaries.mjs
      - name: Commit validated migration
        shell: bash
        run: |
          git config user.name "CarBroz Architecture Bot"
          git config user.email "architecture@carbroz.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes remain."
          else
            git commit -m "refactor(architecture): migrate backend to canonical v3 topology"
            git push origin HEAD:feature/backend-v3-canonical-migration
          fi
