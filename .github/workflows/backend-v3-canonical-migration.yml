name: Backend V3 Canonical Migration

on:
  push:
    branches:
      - feature/backend-v3-canonical-migration

permissions:
  contents: write

jobs:
  migrate-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.9.0 --activate
      - name: Normalize migration runner
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const file = 'tools/backend-v3-migrate.mjs';
          let s = fs.readFileSync(file, 'utf8');
          s = s.replace("['domains/partner/', 'domains/catalog-pricing/', 'domains/financials/', 'domains/operations/', 'domains/communications/', 'domains/engagement/', 'domains/configuration/', 'domains/enterprise/', 'apps/api', 'GLOBAL', 'PARTNER', 'CUSTOMER']", "['partner/', 'catalog-pricing/', 'financials/', 'operations/', 'communications/', 'engagement/', 'configuration/', 'enterprise/', 'apps/', 'GLOBAL', 'PARTNER', 'CUSTOMER']");
          s = s.replace("if (!owner || !newAbs.endsWith('.ts')) continue;", "if (!owner || !newAbs.endsWith('.ts') || !fs.existsSync(newAbs)) continue;");
          s = s.replace("/import\\s+(type\\s+)?\\{([\\s\\S]*?)\\}\\s+from\\s+['\"]@carbroz\\/common['\"];?/g", "/import\\s+(type\\s+)?\\{([^}]*)\\}\\s+from\\s+['\"]@carbroz\\/common['\"];?/g");
          s = s.replace("['platform/storage/','@carbroz/platform-storage'], ['apps/api/','@carbroz/api'],", "['platform/storage/','@carbroz/platform-storage'], ['sdui/registry/','@carbroz/sdui-registry'], ['sdui/ui-sdk/','@carbroz/ui-sdk'], ['apps/api/','@carbroz/api'],");
          s = s.replace("// Common aliases known to be exported without a declaration match.\nsymbolOwner.set('ResponseHelper', '@carbroz/api');", "// Index canonical SDUI symbols that were never correctly owned by common.\nfor (const [dir, owner] of [['sdui/registry','@carbroz/sdui-registry'], ['sdui/ui-sdk','@carbroz/ui-sdk']]) {\n  for (const f of walk(p(dir)).filter((x) => x.endsWith('.ts'))) {\n    const t = fs.readFileSync(f, 'utf8');\n    for (const m of t.matchAll(/export\\s+(?:declare\\s+)?(?:abstract\\s+)?(?:class|interface|enum|type|const|function)\\s+([A-Za-z_$][\\w$]*)/g)) symbolOwner.set(m[1], owner);\n  }\n}\n// Common aliases known to be exported without a declaration match.\nsymbolOwner.set('ResponseHelper', '@carbroz/api');");
          s = s.replace("// Platform consolidation: technology only.", `// Business persistence adapters belong to their bounded context, never platform/database.\nconst databaseRepositoryOwners = {\n  PrismaAdminRoleRepository: 'identity', PrismaUserRepository: 'identity', PrismaUserSessionRepository: 'identity', PrismaRoleRepository: 'identity', PrismaPermissionRepository: 'identity',\n  PrismaPartnerRepository: 'partner', PrismaPartnerMemberRepository: 'partner', PrismaPartnerProfileRepository: 'partner',\n  PrismaCatalogRepository: 'catalog-pricing', PrismaPricingRepository: 'catalog-pricing',\n  PrismaPaymentRepository: 'financials', PrismaInvoiceRepository: 'financials', PrismaPartnerPayoutRepository: 'financials',\n  PrismaTrackingSessionRepository: 'operations',\n  PrismaNotificationLogRepository: 'communications', PrismaDeviceTokenRepository: 'communications',\n  PrismaReviewRepository: 'engagement', PrismaCouponRepository: 'engagement', PrismaCouponUsageRepository: 'engagement',\n  PrismaConfigRepository: 'configuration', PrismaFeatureFlagRepository: 'configuration',\n  PrismaDisputeRepository: 'dispute', PrismaAuditLogRepository: 'audit',\n  PrismaCorporateAccountRepository: 'enterprise', PrismaCorporateMemberRepository: 'enterprise', PrismaCorporateFleetVehicleRepository: 'enterprise', PrismaCorporateCreditLedgerRepository: 'enterprise', PrismaCorporateInvoiceRepository: 'enterprise',\n};\nfor (const [className, domain] of Object.entries(databaseRepositoryOwners)) {\n  const from = \\`platform/database/src/repositories/\\${className}.ts\\`;\n  if (exists(from)) moveFile(from, \\`domains/\\${domain}/infrastructure/repositories/\\${className}.ts\\`);\n}\nif (exists('platform/database/src/index.ts')) {\n  write('platform/database/src/index.ts', [\n    \"export * from './providers/PrismaProvider.js';\",\n    \"export * from './providers/PrismaDatabaseProvider.js';\",\n    \"export * from './providers/PrismaTransactionProvider.js';\",\n    \"export * from './repositories/PrismaRepositoryBase.js';\",\n    \"export * from './repositories/RepositoryFactory.js';\",\n    \"export * from './public/index.js';\",\n    '',\n  ].join('\\n'));\n}\n\n// Platform consolidation: technology only.`);
          s = s.replace("// Retire duplicate legacy roots after source classification.", "// Technical environment/runtime configuration belongs to API bootstrap, not the business Configuration domain.\nmoveTree('packages/config/src', 'apps/api/src/bootstrap/config');\n\n// Retire duplicate legacy roots after source classification.");
          s = s.replace("rm('packages/config');\nrm('shared');", "rm('packages/config');\nrm('packages');\nrm('shared');");
          s = s.replace("for (const file of walk(root).filter((x) => x.endsWith('.ts'))) {\n  let text = fs.readFileSync(file, 'utf8');", "for (const file of walk(root).filter((x) => x.endsWith('.ts'))) {\n  let text = fs.readFileSync(file, 'utf8');\n  if (text.includes('@carbroz/config')) {\n    if (!rel(file).startsWith('apps/api/')) throw new Error(`Technical @carbroz/config consumer outside API bootstrap boundary: ${rel(file)}`);\n    const configIndex = p('apps/api/src/bootstrap/config/index.ts');\n    const spec = toJsRelative(file, configIndex);\n    text = text.replaceAll(\"'@carbroz/config'\", `'${spec}'`).replaceAll('\"@carbroz/config\"', `\"${spec}\"`);\n  }\n  text = text.replace(/import\\(['\"]@carbroz\\/common['\"]\\)\\.([A-Za-z_$][\\w$]*)/g, (all, symbol) => {\n    const owner = symbolOwner.get(symbol);\n    if (!owner) throw new Error(`No canonical owner for @carbroz/common type query ${symbol} in ${rel(file)}`);\n    return `import('${owner}').${symbol}`;\n  });");
          s = s.replace("if (text.includes('@carbroz/common')) text = rewriteCommonImports(file, text);", "if (text.includes('@carbroz/common')) text = rewriteCommonImports(file, text);\n  text = text.replace(/import\\s+(type\\s+)?\\{([^}]*)\\}\\s+from\\s+['\"]@carbroz\\/platform-database['\"];?/g, (all, typeOnly, body) => {\n    const groups = new Map();\n    for (const token of body.split(',').map((x) => x.trim()).filter(Boolean)) {\n      const original = token.replace(/^type\\s+/, '').split(/\\s+as\\s+/)[0].trim();\n      const owner = symbolOwner.get(original);\n      const pkg = owner && owner !== '@carbroz/platform-database' ? owner : '@carbroz/platform-database';\n      const arr = groups.get(pkg) ?? []; arr.push(token); groups.set(pkg, arr);\n    }\n    return [...groups.entries()].map(([pkg, names]) => `import ${typeOnly ?? ''}{ ${names.join(', ')} } from '${pkg}';`).join('\\n');\n  });");
          s = s.replace("!f.includes('/infrastructure/'))", "(!f.includes('/infrastructure/') || f.includes('/infrastructure/repositories/')))");
          s = s.replace("if (text.includes('@carbroz/common')) throw new Error(`Legacy common import remains: ${rel(f)}`);", "if (/from\\s+['\"]@carbroz\\/common['\"]/.test(text) || /import\\(['\"]@carbroz\\/common['\"]\\)/.test(text)) throw new Error(`Legacy common import remains: ${rel(f)}`);");
          s = s.replace("if (text.includes('@carbroz/config')) throw new Error(`Legacy config import remains: ${rel(f)}`);", "if (/from\\s+['\"]@carbroz\\/config['\"]/.test(text) || /import\\(['\"]@carbroz\\/config['\"]\\)/.test(text)) throw new Error(`Legacy config import remains: ${rel(f)}`);");
          s = s.replace("for (const f of walk(p('apps/api/src')).filter((x) => x.endsWith('.ts'))) {", "if (exists('platform/database/src/repositories')) {\n  for (const f of walk(p('platform/database/src/repositories')).filter((x) => /^Prisma(?!RepositoryBase)/.test(path.basename(x)))) throw new Error(`Business repository remains in platform/database: ${rel(f)}`);\n}\nfor (const f of walk(p('apps/api/src')).filter((x) => x.endsWith('.ts'))) {");
          fs.writeFileSync(file, s);
          NODE
      - name: Generate canonical architecture
        run: node tools/backend-v3-migrate.mjs
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Prisma validate
        run: pnpm prisma validate
      - name: Prisma generate
        run: pnpm prisma generate
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm exec eslint --quiet .
      - name: Test
        run: pnpm test
      - name: Verify final topology
        run: node tools/backend-v3-migrate.mjs
      - name: Commit validated migration
        shell: bash
        run: |
          git config user.name "CarBroz Architecture Bot"
          git config user.email "architecture@carbroz.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes remain."
          else
            git commit -m "refactor(architecture): migrate backend to canonical v3 topology"
            git push origin HEAD:feature/backend-v3-canonical-migration
          fi
