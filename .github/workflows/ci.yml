name: CarBroz Backend CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://carbroz_ci:carbroz_ci@127.0.0.1:5432/carbroz_ci
      JWT_SECRET: carbroz-ci-validation-only-secret-not-for-runtime
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carbroz_ci
          POSTGRES_PASSWORD: carbroz_ci
          POSTGRES_DB: carbroz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carbroz_ci -d carbroz_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate repository pnpm version
        run: corepack prepare pnpm@11.9.0 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify CW2 physical architecture
        run: node tools/architecture-closeout.mjs

      - name: Verify CW1/CW2 Constitution regression baseline
        run: node tools/architecture-closeout-constitution-gate.mjs --regression

      - name: Verify CW3 bounded-context and dependency convergence
        run: node tools/cw3-boundary-gate.mjs

      - name: Verify CW4 domain/application contract convergence
        run: node tools/cw4-contract-gate.mjs

      - name: Prisma validate
        run: pnpm prisma validate

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Apply PostgreSQL migrations
        run: pnpm prisma migrate deploy

      - name: Verify fresh PostgreSQL schema convergence
        shell: bash
        run: |
          set -o pipefail
          pnpm prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            --exit-code 2>&1 | tee prisma-schema-drift.sql

      - name: Upload Prisma schema drift diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prisma-schema-drift
          path: prisma-schema-drift.sql
          if-no-files-found: error

      - name: Build monorepo packages
        run: pnpm build

      - name: Run ESLint
        shell: bash
        run: |
          set -o pipefail
          pnpm exec eslint --quiet . 2>&1 | tee eslint-output.txt

      - name: Upload ESLint diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostic
          path: eslint-output.txt
          if-no-files-found: error

      - name: Run Vitest suite
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run 2>&1 | tee vitest-output.txt

      - name: Upload Vitest diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-diagnostic
          path: vitest-output.txt
          if-no-files-found: error

      - name: Re-verify CW1/CW2 Constitution regression baseline
        run: node tools/architecture-closeout-constitution-gate.mjs --regression

      - name: Re-verify CW3 bounded-context and dependency convergence
        run: node tools/cw3-boundary-gate.mjs

      - name: Re-verify CW4 domain/application contract convergence
        run: node tools/cw4-contract-gate.mjs

      - name: Prove validation is non-mutating
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
