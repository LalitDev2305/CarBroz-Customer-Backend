name: CarBroz Backend CI

on:
  push:
    branches:
      - main
      - architecture-v2
      - architecture/backend-v3-clean
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - architecture-v2
      - architecture/backend-v3-clean

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Validation-only CI configuration. Runtime/integration jobs must provide their own
      # environment-specific database and secret values.
      DATABASE_URL: postgresql://carbroz_ci:carbroz_ci@127.0.0.1:5432/carbroz_ci
      JWT_SECRET: carbroz-ci-validation-only-secret-not-for-runtime

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate repository pnpm version
        run: corepack prepare pnpm@11.9.0 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Stage A diagnostic only. Final architecture-freeze gate restores --frozen-lockfile
      # after the canonical workspace migration regenerates and commits pnpm-lock.yaml.
      - name: Install dependencies (Stage A migration diagnostic)
        run: pnpm install --no-frozen-lockfile

      - name: Prisma validate
        run: pnpm prisma validate

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Build monorepo packages
        run: pnpm build

      - name: Run ESLint
        shell: bash
        run: |
          set -o pipefail
          pnpm exec eslint --quiet . 2>&1 | tee eslint-output.txt

      - name: Upload ESLint diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostic
          path: eslint-output.txt
          if-no-files-found: error

      - name: Run Vitest suite
        run: pnpm test
