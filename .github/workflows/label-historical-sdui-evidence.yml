name: Label Historical SDUI Evidence

on:
  push:
    branches: [development]
    paths:
      - .github/label-historical-sdui-evidence.trigger

permissions:
  contents: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Mark superseded audit documents as historical evidence
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'sdui/SDUI-FINAL-FORENSIC-AUDIT.md': (
              '# CarBroz SDUI Final Forensic Convergence Audit\n',
              '# CarBroz SDUI Final Forensic Convergence Audit\n\n> **HISTORICAL / SUPERSEDED IMPLEMENTATION EVIDENCE:** This audit records the earlier `ui-sdk` convergence state. It is not current implementation authority and MUST NOT be used to restore `ui-sdk`, `SduiScreenBuilder`, Partner wrapper builders, or the old action-contract path. Current authority is `sdui/README.md` -> `SDUI-COMPOSE-CONTRACT-IMPLEMENTATION-PLAN.md` -> current Partner Auth contracts -> current source/gates.\n'
            ),
            'sdui/PHASE-A-SOURCE-RECONCILIATION.md': (
              '# SDUI Phase A — Source Reconciliation\n',
              '# SDUI Phase A — Source Reconciliation\n\n> **HISTORICAL / SUPERSEDED MIGRATION EVIDENCE:** This document describes the source state and decisions at Phase A. References to `ui-sdk` or migration-era owners are historical and do not override the current `sdui/README.md`, frozen SDUI implementation plan, current Constitution, or current source/gates.\n'
            ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: expected exactly one title')
              path.write_text(text.replace(old, new, 1))
      - name: Verify labels
        run: |
          grep -q 'HISTORICAL / SUPERSEDED IMPLEMENTATION EVIDENCE' sdui/SDUI-FINAL-FORENSIC-AUDIT.md
          grep -q 'HISTORICAL / SUPERSEDED MIGRATION EVIDENCE' sdui/PHASE-A-SOURCE-RECONCILIATION.md
      - name: Commit labels and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/label-historical-sdui-evidence.yml .github/label-historical-sdui-evidence.trigger
          git add sdui/SDUI-FINAL-FORENSIC-AUDIT.md sdui/PHASE-A-SOURCE-RECONCILIATION.md
          git commit -m "docs(sdui): label superseded audits as historical"
          git push origin HEAD:development
