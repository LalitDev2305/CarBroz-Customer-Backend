name: Backend V3 Stage A Source Finalize

on:
  push:
    branches:
      - feature/backend-v3-stage-a-cleanup

permissions:
  contents: write

jobs:
  finalize-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite canonical DI ownership only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/bootstrap/container/index.ts')
          s = p.read_text()
          replacements = {
            "import { VerifyPartnerUseCase } from '../../surfaces/partner/use-cases/VerifyPartnerUseCase.js';": "import { VerifyPartnerUseCase } from '@carbroz/domain-partner';",
            "import { PrismaCustomerProfileRepository, PrismaAddressRepository } from '@carbroz/platform-database';": "import { PrismaCustomerProfileRepository, PrismaAddressRepository } from '@carbroz/domain-customer';",
            "import { PartnerController } from '../../surfaces/partner/partner.controller.js';\n": "",
            "import { AdminPartnerController } from '../../surfaces/admin/admin-partner.controller.js';\n": "",
            "import { CorporateController } from '../../surfaces/customer/corporate/controllers/CorporateController.js';\n": "",
            "import { AdminCorporateController } from '../../surfaces/customer/corporate/controllers/AdminCorporateController.js';\n": "",
            "  partnerController: PartnerController;\n": "",
            "  adminPartnerController: AdminPartnerController;\n": "",
            "  corporateController: CorporateController;\n": "",
            "  adminCorporateController: AdminCorporateController;\n": "",
            "      partnerController: asClass(PartnerController).classic().scoped(),\n": "",
            "      adminPartnerController: asClass(AdminPartnerController).classic().scoped(),\n": "",
            "      corporateController: asClass(CorporateController).classic().scoped(),\n": "",
            "      adminCorporateController: asClass(AdminCorporateController).classic().scoped(),\n": "",
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Canonicalize root integration and e2e test source layout
        shell: bash
        run: |
          mkdir -p tests/integration tests/e2e
          git mv apps/api/src/bootstrap/container/index.test.ts tests/integration/api-container.integration.test.ts
          for f in apps/api/tests/*.test.ts; do
            [ -e "$f" ] || continue
            git mv "$f" "tests/integration/$(basename "$f")"
          done
          rm -f apps/api/tests/GetInitConfigUseCase.spec.ts
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('tests/integration').glob('*.ts'):
            s=p.read_text()
            s=s.replace("from './index.js'", "from '../../apps/api/src/bootstrap/container/index.js'")
            s=s.replace("from '../src/", "from '../../apps/api/src/")
            p.write_text(s)
          PY
          cat > tests/e2e/api-surface-routing.e2e.test.ts <<'EOF'
          import { afterAll, beforeAll, describe, expect, it } from 'vitest';
          import { buildApp } from '../../apps/api/src/bootstrap/app.js';
          import type { FastifyInstance } from 'fastify';

          describe('canonical API surface routing', () => {
            let app: FastifyInstance;

            beforeAll(async () => {
              app = await buildApp();
              await app.ready();
            });

            afterAll(async () => {
              await app.close();
            });

            it('exposes Partner, Customer, Admin and health route families', () => {
              const routes = app.printRoutes();
              expect(routes).toContain('partner');
              expect(routes).toContain('customer');
              expect(routes).toContain('admin');
              expect(routes).toContain('health');
            });

            it('does not expose retired global product route families', () => {
              const routes = app.printRoutes();
              expect(routes).not.toContain('/v1/auth');
              expect(routes).not.toContain('/v1/config');
              expect(routes).not.toContain('/api/v1/app');
              expect(routes).not.toContain('/api/v1/maps');
              expect(routes).not.toContain('/api/v1/sdui');
            });
          });
          EOF

      - name: Remove this one-shot finalizer and commit source snapshot
        shell: bash
        run: |
          git rm .github/workflows/backend-v3-stage-a-source-finalize.yml
          git config user.name "CarBroz Architecture Bot"
          git config user.email "architecture@carbroz.local"
          git add -A
          git commit -m "refactor(stage-a): finalize source ownership and test taxonomy"
          git push origin HEAD:feature/backend-v3-stage-a-cleanup
