name: Phase4 Lockfile Sync

on:
  push:
    branches: [development]
    paths:
      - 'domains/identity/package.json'
      - '.github/workflows/phase4-lockfile-sync.yml'

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.9.0 --activate
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only
      - name: Commit synchronized lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/phase4-lockfile-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/phase4-lockfile-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(lockfile): sync Phase 4 workspace dependency"
          git push origin HEAD:development
