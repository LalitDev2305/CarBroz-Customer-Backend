name: Phase4 test completeness

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/phase4-test-completeness.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Strengthen Phase 4 focused assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('platform/integrations/src/identity/RedisOtpChallengeRepository.spec.ts')
          s = p.read_text()

          old = """  keys(): string[] { return [...this.values.keys(), ...this.sortedSets.keys()]; }\n  storedValues(): string[] { return [...this.values.values()].map((entry) => entry.value); }\n  overwrite(key: string, value: string): void {"""
          new = """  keys(): string[] { return [...this.values.keys(), ...this.sortedSets.keys()]; }\n  storedValues(): string[] { return [...this.values.values()].map((entry) => entry.value); }\n  ttlMs(key: string): number | null {\n    const valueExpiry = this.values.get(key)?.expiresAt;\n    if (valueExpiry !== undefined) return valueExpiry - Date.now();\n    const sortedSetExpiry = this.sortedSetExpiry.get(key);\n    return sortedSetExpiry === undefined ? null : sortedSetExpiry - Date.now();\n  }\n  overwrite(key: string, value: string): void {"""
          if old not in s: raise SystemExit('missing helper insertion anchor')
          s = s.replace(old, new, 1)

          old = """    expect(client.keys().every((key) => key.startsWith(NAMESPACE))).toBe(true);\n    expect(client.storedValues().join('|')).not.toContain('123456');\n  });"""
          new = """    expect(client.keys().every((key) => key.startsWith(NAMESPACE))).toBe(true);\n    const persistedKeys = client.keys();\n    expect(persistedKeys.some((key) => key.startsWith(`${NAMESPACE}challenge:`))).toBe(true);\n    expect(persistedKeys).toContain(`${NAMESPACE}public:${created!.publicId}`);\n    expect(persistedKeys.some((key) => key.startsWith(`${NAMESPACE}phone:`) && key.endsWith(':latest'))).toBe(true);\n    for (const key of persistedKeys.filter((key) => !key.endsWith(':seq'))) {\n      expect(client.ttlMs(key)).not.toBeNull();\n      expect(client.ttlMs(key)!).toBeGreaterThan(0);\n    }\n    expect(client.storedValues().join('|')).not.toContain('123456');\n\n    await client.del(`${NAMESPACE}public:${created!.publicId}`);\n    await expect(repository.findForVerification(created!.publicId, '+919876543210', 'device-1')).resolves.toBeNull();\n    const encodedPhone = Buffer.from('+919876543210', 'utf8').toString('base64url');\n    await client.del(`${NAMESPACE}phone:${encodedPhone}:latest`);\n    await expect(repository.findLatestByPhone('+919876543210')).resolves.toBeNull();\n  });"""
          if old not in s: raise SystemExit('missing roundtrip assertion anchor')
          s = s.replace(old, new, 1)

          old = """    const updates = await Promise.all(Array.from({ length: 7 }, () => repository.recordFailedAttempt(challenge.id, 5)));\n    expect(updates.filter(Boolean)).toHaveLength(5);\n    const secondNow = new Date('2026-09-09T09:33:00.000Z');"""
          new = """    const updates = await Promise.all(Array.from({ length: 7 }, () => repository.recordFailedAttempt(challenge.id, 5)));\n    expect(updates.filter(Boolean)).toHaveLength(5);\n    await expect(repository.tryConsume(challenge.id, new Date(now.getTime() + 1000), 5)).resolves.toBe(false);\n    const secondNow = new Date('2026-09-09T09:33:00.000Z');"""
          if old not in s: raise SystemExit('missing max-attempt anchor')
          s = s.replace(old, new, 1)

          old = """    const second = (await repository.tryCreateWithinRateLimit(createInput(secondNow, '+912222222222'), guard(secondNow)))!;\n    const consumed = await Promise.all(Array.from({ length: 5 }, () => repository.tryConsume(second.id, new Date(secondNow.getTime() + 1000), 5)));\n    expect(consumed.filter(Boolean)).toHaveLength(1);\n  });"""
          new = """    const second = (await repository.tryCreateWithinRateLimit(createInput(secondNow, '+912222222222'), guard(secondNow)))!;\n    await expect(repository.tryConsume(second.id, new Date(second.expiresAt.getTime() + 1), 5)).resolves.toBe(false);\n    const consumed = await Promise.all(Array.from({ length: 5 }, () => repository.tryConsume(second.id, new Date(secondNow.getTime() + 1000), 5)));\n    expect(consumed.filter(Boolean)).toHaveLength(1);\n    await expect(repository.tryConsume(second.id, new Date(secondNow.getTime() + 2000), 5)).resolves.toBe(false);\n  });"""
          if old not in s: raise SystemExit('missing consume anchor')
          s = s.replace(old, new, 1)

          old = """    await repository.invalidate(challenge.id, new Date(now.getTime() + 1000));\n    await repository.invalidate(challenge.id, new Date(now.getTime() + 2000));\n    await expect(repository.tryConsume(challenge.id, new Date(now.getTime() + 3000), 5)).resolves.toBe(false);"""
          new = """    await repository.invalidate(challenge.id, new Date(now.getTime() + 1000));\n    await repository.invalidate(challenge.id, new Date(now.getTime() + 2000));\n    await expect(repository.countCreatedSince(challenge.phoneNumber, guard(now).windowStart)).resolves.toBe(0);\n    await expect(repository.tryConsume(challenge.id, new Date(now.getTime() + 3000), 5)).resolves.toBe(false);"""
          if old not in s: raise SystemExit('missing invalidation anchor')
          s = s.replace(old, new, 1)

          p.write_text(s)

          port = Path('platform/cache/src/ports/IRedisClient.ts')
          t = port.read_text()
          t = t.replace('Minimal Redis client surface required by platform/cache and domain infrastructure adapters.', 'Minimal Redis client surface required by platform/cache and Constitution-compliant technical adapters.')
          port.write_text(t)
          PY
      - name: Commit verification assertions and remove temporary workflow
        run: |
          rm .github/workflows/phase4-test-completeness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform/integrations/src/identity/RedisOtpChallengeRepository.spec.ts platform/cache/src/ports/IRedisClient.ts .github/workflows/phase4-test-completeness.yml
          git commit -m 'test(identity): complete Phase 4 Redis OTP verification matrix'
          git push origin HEAD:development
