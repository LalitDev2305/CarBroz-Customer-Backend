name: Temporary Build Diagnostic

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  capture-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.9.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Capture build output
        shell: bash
        run: |
          set +e
          pnpm build > build-diagnostic.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> build-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-diagnostic.txt
          git commit -m "chore(ci): capture build diagnostic"
          git push origin HEAD:development
          exit 0
