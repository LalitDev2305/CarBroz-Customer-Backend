name: CW2 Physical Structure Materializer

on:
  push:
    branches: [fix/stage-a-production-definitions]
    paths: [.github/workflows/cw2-materialize.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://carbroz_ci:carbroz_ci@127.0.0.1:5432/carbroz_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carbroz_ci
          POSTGRES_PASSWORD: carbroz_ci
          POSTGRES_DB: carbroz_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carbroz_ci -d carbroz_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage-a-production-definitions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - name: Correct ExecutionContext producer
        run: sed -i "s#path.join(apiRoot,'context/toExecutionContext.ts')#path.join(apiRoot,'bootstrap/lifecycle/toExecutionContext.ts')#g" tools/architecture-closeout-api.mjs
      - run: node tools/architecture-closeout.mjs
      - run: node tools/architecture-closeout-finalize.mjs
      - run: node tools/architecture-closeout-lastmile.mjs
      - run: node tools/generate-module-readmes.mjs
      - run: node tools/architecture-closeout-constitution-gate.mjs
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec vitest run tests/architecture/workspace-taxonomy.policy.test.ts tests/architecture/canonical-topology.policy.test.ts
      - run: pnpm -r build
      - run: pnpm lint
      - run: pnpm test -- --run
      - name: Commit CW2 physical convergence
        run: |
          git config user.name "CarBroz Architecture Bot"
          git config user.email "architecture@carbroz.local"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(cw2): materialize canonical repository topology"
          git push origin HEAD:fix/stage-a-production-definitions
