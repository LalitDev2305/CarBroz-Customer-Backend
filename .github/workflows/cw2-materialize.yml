name: CW2 Physical Structure Materializer
on:
  push:
    branches: [fix/stage-a-production-definitions]
    paths: [.github/workflows/cw2-materialize.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage-a-production-definitions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - name: Correct canonical ExecutionContext producer
        run: sed -i "s#path.join(apiRoot,'context/toExecutionContext.ts')#path.join(apiRoot,'bootstrap/lifecycle/toExecutionContext.ts')#g" tools/architecture-closeout-api.mjs
      - name: Materialize canonical repository candidate
        run: |
          node tools/architecture-closeout.mjs
          node tools/architecture-closeout-finalize.mjs
          node tools/architecture-closeout-lastmile.mjs
          rm -rf apps/api/src/context
      - name: Prove CW2 physical taxonomy
        run: |
          test ! -e packages
          test ! -e apps/api/src/modules
          test ! -e apps/api/src/context
          grep -q 'apps/\*' pnpm-workspace.yaml
          ! grep -q 'packages/\*' pnpm-workspace.yaml
          pnpm exec vitest run tests/architecture/workspace-taxonomy.policy.test.ts tests/architecture/canonical-topology.policy.test.ts
      - name: Refresh final workspace
        run: pnpm install --no-frozen-lockfile
      - name: Build canonical workspace
        run: pnpm -r build
      - name: Lint canonical workspace
        run: pnpm lint
      - name: Run regression suite
        run: pnpm test -- --run
      - name: Commit CW2 physical convergence
        run: |
          git config user.name "CarBroz Architecture Bot"
          git config user.email "architecture@carbroz.local"
          rm -f .github/workflows/cw2-materialize.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(cw2): materialize canonical repository topology"
          git push origin HEAD:fix/stage-a-production-definitions
