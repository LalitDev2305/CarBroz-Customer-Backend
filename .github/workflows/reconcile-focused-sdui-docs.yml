name: Reconcile Focused SDUI Docs

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/reconcile-focused-sdui-docs.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Reconcile only frozen SDUI authority passages
        shell: python
        run: |
          from pathlib import Path

          constitution = Path('docs/MASTER-BACKEND-CONSTITUTION.md')
          text = constitution.read_text()
          replacements = [
              (
                  "├── sdui/\n│   ├── ui-sdk/\n│   └── registry/",
                  "├── sdui/\n│   ├── engine/\n│   └── registry/",
              ),
              (
                  "Exactly two SDUI workspace packages are canonical:\n\n```text\nsdui/\n├── ui-sdk/      generic structural/composition SDK\n└── registry/    SDUI draft/publish/version persistence lifecycle\n```\n\nFinal package identities:\n\n```text\n@carbroz/ui-sdk\n@carbroz/sdui-registry\n```\n\nNo second UI SDK, `sdui-engine`, UI schema package, API-local duplicate SDUI DTO hierarchy or domain-local duplicate structural contract may exist after migration.",
                  "Exactly two SDUI workspace packages are canonical:\n\n```text\nsdui/\n├── engine/      canonical SDUI language/composition/definitions/validation/screen composition\n└── registry/    persisted draft/publish/version lifecycle only\n```\n\nFinal package identities:\n\n```text\n@carbroz/sdui-engine\n@carbroz/sdui-registry\n```\n\nThe retired `sdui/ui-sdk` / `@carbroz/ui-sdk` architecture MUST NOT be restored. No second SDUI engine, UI schema package, API-local duplicate SDUI DTO hierarchy or domain-local duplicate structural contract may exist.",
              ),
              (
                  "## 25. `sdui/ui-sdk` responsibility\n\n`ui-sdk` is the one canonical generic SDUI language and composition toolkit. It owns runtime contracts, reusable definitions, registries, factories, builders, validation, serialization and schema versioning.\n\n```text\nsdui/ui-sdk/\n├── contract/\n│   ├── screen/\n│   ├── template/\n│   ├── component/\n│   ├── section/\n│   ├── group/\n│   ├── element/\n│   ├── action/\n│   ├── theme/\n│   └── properties/\n├── definitions/\n│   ├── templates/\n│   ├── components/\n│   ├── sections/\n│   ├── groups/\n│   └── elements/\n├── registry/\n├── factory/\n├── builder/\n├── validator/\n├── serializer/\n├── versioning/\n├── public/\n└── tests/\n```",
                  "## 25. `sdui/engine` responsibility\n\n`engine` is the one canonical generic SDUI language, composition and validation authority. It owns runtime contracts, reusable node definitions, property/default resolution, generic actions/references, `NodeDefinitionRegistry`, `ScreenRegistry`, `SduiBuilder`, `SduiValidator`, `SduiService`, serialization/model contracts, schema versioning and code-composed Partner/Customer/Admin screen composers.\n\nThe engine MUST NOT own persisted draft/publication history. That lifecycle remains in `sdui/registry` while concrete runtime/admin consumers require it. No API surface or business domain may create a parallel screen builder, validator or presentation contract.",
              ),
              (
                  "`registry` owns SDUI runtime lifecycle only: screen metadata, drafts, publish, immutable versions, rollback, target application/scope, persistence, checksums and version history. It consumes `@carbroz/ui-sdk`; it never redefines UI structure or composition mechanics.",
                  "`registry` owns persisted SDUI lifecycle only: screen metadata, drafts, publish, immutable versions, rollback, target application/scope, persistence, checksums and version history. It consumes `@carbroz/sdui-engine`; it never redefines UI structure, properties, actions, definitions, validation or composition mechanics.",
              ),
              (
                  "4. Ensure canonical SDUI authority is `sdui/engine` for language/composition/validation plus `sdui/registry` only for persisted lifecycle; remove duplicate authorities and never restore `ui-sdk`.",
                  "4. Preserve canonical SDUI authority in `sdui/engine` for language/composition/definitions/validation/screen composition, with `sdui/registry` restricted to persisted lifecycle/version resolution while concrete current consumers require it; never restore `ui-sdk`.",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Constitution replacement expected once, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          constitution.write_text(text)

          plan = Path('sdui/SDUI-COMPOSE-CONTRACT-IMPLEMENTATION-PLAN.md')
          text = plan.read_text()
          replacements = [
              (
                  "`sdui/ui-sdk` and `sdui/registry` are migration/compatibility sources until their remaining behavior is safely converged. They are not permanent parallel SDUI authoring engines.",
                  "`sdui/engine` is the canonical SDUI language/composition/validation owner. The retired `sdui/ui-sdk` must not return. The standalone `sdui/registry` remains only as a persisted lifecycle/version boundary while concrete current runtime/admin consumers require that behavior; it is not a parallel authoring engine.",
              ),
              (
                  "The full canonical wire-level contract remains in `sdui/ui-sdk/ACTION-CONTRACT.md` during migration and must converge into engine ownership without changing semantics.",
                  "The canonical wire-level action/reference contract is owned by `sdui/engine/src/core/Action.ts` and its engine tests. No retired `ui-sdk` action contract or parallel action framework is authoritative.",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'SDUI plan replacement expected once, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          plan.write_text(text)

      - name: Verify retired architecture is no longer normative
        run: |
          ! grep -q 'sdui/ui-sdk/ACTION-CONTRACT.md' sdui/SDUI-COMPOSE-CONTRACT-IMPLEMENTATION-PLAN.md
          ! grep -q '├── ui-sdk/' docs/MASTER-BACKEND-CONSTITUTION.md
          ! grep -q '^@carbroz/ui-sdk$' docs/MASTER-BACKEND-CONSTITUTION.md
          grep -q 'sdui/engine' docs/MASTER-BACKEND-CONSTITUTION.md
          grep -q 'sdui/engine/src/core/Action.ts' sdui/SDUI-COMPOSE-CONTRACT-IMPLEMENTATION-PLAN.md

      - name: Commit reconciliation and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconcile-focused-sdui-docs.yml
          git add docs/MASTER-BACKEND-CONSTITUTION.md sdui/SDUI-COMPOSE-CONTRACT-IMPLEMENTATION-PLAN.md
          git commit -m "docs(sdui): reconcile constitution with frozen engine"
          git push origin HEAD:development
