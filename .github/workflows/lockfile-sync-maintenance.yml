name: Lockfile Sync Maintenance

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/lockfile-sync-maintenance.yml'

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate repository pnpm version
        run: corepack prepare pnpm@11.9.0 --activate

      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already synchronized.'
            exit 0
          fi
          git config user.name 'CarBroz Architecture Bot'
          git config user.email 'architecture@carbroz.local'
          git add pnpm-lock.yaml
          git commit -m 'fix(build): synchronize workspace lockfile'
          git push origin HEAD:development
